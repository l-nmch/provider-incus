apiVersion: image.incus.crossplane.io/v1alpha1
kind: Image
metadata:
  annotations:
    meta.upbound.io/example-id: image/v1alpha1/image
  labels:
    testing.upbound.io/example-name: alpine
  name: alpine
spec:
  forProvider:
    sourceImage:
      name: alpine/edge
      remote: images

---

apiVersion: instance.incus.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: image/v1alpha1/image
  labels:
    testing.upbound.io/example-name: test1
  name: test1
spec:
  forProvider:
    ephemeral: false
    image: ${incus_image.alpine.fingerprint}
