apiVersion: profile.incus.crossplane.io/v1alpha1
kind: Profile
metadata:
  annotations:
    meta.upbound.io/example-id: profile/v1alpha1/profile
  labels:
    testing.upbound.io/example-name: profile1
  name: profile1
spec:
  forProvider:
    config:
      limits.cpu: 2
    device:
    - name: shared
      properties:
        path: /tmp
        source: /tmp
      type: disk
    - name: root
      properties:
        path: /
        pool: default
      type: disk

---

apiVersion: instance.incus.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: profile/v1alpha1/profile
  labels:
    testing.upbound.io/example-name: test1
  name: test1
spec:
  forProvider:
    ephemeral: false
    image: ubuntu
    profilesRefs:
    - name: profile1
