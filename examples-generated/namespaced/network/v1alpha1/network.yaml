apiVersion: network.incus.m.crossplane.io/v1alpha1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/network
  labels:
    testing.upbound.io/example-name: new_default
  name: new-default
  namespace: crossplane-system
spec:
  forProvider:
    config:
      ipv4.address: 10.150.19.1/24
      ipv4.nat: "true"
      ipv6.address: fd42:474b:622d:259d::1/64
      ipv6.nat: "true"
    name: new_default

---

apiVersion: instance.incus.m.crossplane.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/network
  labels:
    testing.upbound.io/example-name: test1
  name: test1
  namespace: crossplane-system
spec:
  forProvider:
    ephemeral: false
    image: ubuntu
    profilesRefs:
    - name: profile1

---

apiVersion: profile.incus.m.crossplane.io/v1alpha1
kind: Profile
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/network
  labels:
    testing.upbound.io/example-name: profile1
  name: profile1
  namespace: crossplane-system
spec:
  forProvider:
    device:
    - name: eth0
      properties:
        nictype: bridged
        parent: new_default
      type: nic
    - name: root
      properties:
        path: /
        pool: default
      type: disk
