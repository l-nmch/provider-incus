# A pool in a cluster is first defined on every member (target), then
# created cluster-wide by the untargeted one.
apiVersion: storage.incus.m.crossplane.io/v1alpha1
kind: Pool
metadata:
  name: xptest-dir-01
  namespace: xptest
spec:
  forProvider:
    name: xptest-dir
    driver: dir
    target: comp-opti-01.phorge
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: storage.incus.m.crossplane.io/v1alpha1
kind: Pool
metadata:
  name: xptest-dir-02
  namespace: xptest
spec:
  forProvider:
    name: xptest-dir
    driver: dir
    target: comp-opti-02.phorge
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: storage.incus.m.crossplane.io/v1alpha1
kind: Pool
metadata:
  name: xptest-dir-03
  namespace: xptest
spec:
  forProvider:
    name: xptest-dir
    driver: dir
    target: comp-opti-03.phorge
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: storage.incus.m.crossplane.io/v1alpha1
kind: Pool
metadata:
  name: xptest-dir
  namespace: xptest
spec:
  forProvider:
    name: xptest-dir
    driver: dir
    description: e2e dir pool
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: cluster.incus.m.crossplane.io/v1alpha1
kind: Group
metadata:
  name: xptest-group
  namespace: xptest
spec:
  forProvider:
    description: e2e cluster group
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: cluster.incus.m.crossplane.io/v1alpha1
kind: Certificate
metadata:
  name: xptest-cert
  namespace: xptest
spec:
  forProvider:
    description: e2e restricted client certificate
    restricted: true
    projectsRefs:
      - name: xptest
    certificate: |
      ${XPTEST_CERT}
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: network.incus.m.crossplane.io/v1alpha1
kind: Integration
metadata:
  name: xptest-int
  namespace: xptest
spec:
  forProvider:
    type: ovn
    description: e2e OVN interconnect integration
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
apiVersion: cluster.incus.m.crossplane.io/v1alpha1
kind: Server
metadata:
  name: xptest-server
  namespace: xptest
spec:
  forProvider:
    config:
      user.xptest: "1"
  providerConfigRef:
    kind: ProviderConfig
    name: default
