                    "core.bgp_address": ":179",
                    "core.bgp_routerid": "${each.value}"
                  },
                  "for_each": "${tomap(local.bgp_routerids)}",
                  "remote": "${local.remote}",
                  "target": "${each.key}"
                }
              references:
                remote: local.remote
                target: each.key
            - name: global
              manifest: |-
                {
                  "config": {
                    "core.bgp_asn": "65500"
