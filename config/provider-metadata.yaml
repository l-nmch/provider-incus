name: lxc/incus
resources:
    incus_certificate:
        subCategory: ""
        name: incus_certificate
        title: ""
        examples:
            - name: client1
              manifest: |-
                {
                  "certificate": "${file(\"${path.module}/metrics.crt\")}",
                  "name": "client1"
                }
            - name: prometheus
              manifest: |-
                {
                  "certificate": "${file(\"${path.module}/metrics.crt\")}",
                  "description": "Prometheus Node Exporter Access",
                  "name": "prometheus",
                  "projects": [
                    "${incus_project.project1.name}"
                  ],
                  "restricted": true,
                  "type": "metrics"
                }
              references:
                projects: incus_project.project1.name
              dependencies:
                incus_project.project1: |-
                    {
                      "name": "project1"
                    }
            - name: mycert
              manifest: |-
                {
                  "certificate": "-----BEGIN CERTIFICATE-----\n...\n-----END CERTIFICATE-----\n",
                  "name": "mycert"
                }
        argumentDocs:
            certificate: '- Required - The certificate.'
            description: '- Optional - Description of the certificate.'
            fingerprint: '- The fingerprint of the certificate.'
            name: '- Required - Name of the certificate.'
            projects: '- Optional -  List of projects to restrict the certificate to.'
            remote: |-
                - Optional - The remote in which the resource will be created. If
                not provided, the provider's default remote will be used.
            restricted: '- Optional -  Restrict the certificate to one or more projects.'
            type: |-
                - Optional - The type of certificate to create. Can be one of: client,
                or metrics. If no type is specified, a client certificate is created.
        importStatements:
            - terraform import incus_certificate.mycert <fingerprint>
    incus_cluster_group:
        subCategory: ""
        name: incus_cluster_group
        title: ""
        examples:
            - name: amd64
              manifest: |-
                {
                  "description": "x86-64 nodes",
                  "members": [
                    "node-1",
                    "node-2",
                    "node-3"
                  ],
                  "name": "amd64"
                }
            - name: my_group
              manifest: |-
                {
                  "name": "my_group"
                }
        argumentDocs:
            <name>: '- Required - Cluster group name.'
            <remote>: '- Optional - Remote name.'
            config: |-
                - Optional - Map of key/value pairs of
                cluster group config settings.
            description: '- Optional - Description of the cluster group.'
            members: '- Optional - List of cluster group members.'
            name: '- Required - Name of the cluster group.'
            remote: |-
                - Optional - The remote in which the resource will be created. If
                not provided, the provider's default remote will be used.
        importStatements:
            - terraform import incus_cluster_group.my_group [<remote>:]<name>
            - terraform import incus_cluster_group.my_group my_group
    incus_image:
        subCategory: ""
        name: incus_image
        title: ""
        examples:
            - name: alpine
              manifest: |-
                {
                  "source_image": {
                    "name": "alpine/edge",
                    "remote": "images"
                  }
                }
              dependencies:
                incus_instance.test1: |-
                    {
                      "ephemeral": false,
                      "image": "${incus_image.alpine.fingerprint}",
                      "name": "test1"
                    }
            - name: alpine
              manifest: |-
                {
                  "alias": [
                    {
                      "description": "Alpine Linux",
                      "name": "alpine"
                    },
                    {
                      "description": "Alpine Linux Edge",
                      "name": "alpine-edge"
                    }
                  ],
                  "source_image": {
                    "name": "alpine/edge",
                    "remote": "images"
                  }
                }
        argumentDocs:
            alias.description: '- Optional - A description for the alias.'
            alias.name: '- Required - The name of the alias.'
            copied_aliases: |-
                - The list of aliases that were copied from the
                source_image.
            created_at: '- The datetime of image creation, in Unix time.'
            fingerprint: '- The unique hash fingerprint of the image.'
            project: '- Optional - Name of the project where the image will be stored.'
            remote: |-
                - Optional - The remote in which the resource will be created. If
                not provided, the provider's default remote will be used.
            source_file: '- Optional - The image file from the local file system from which the image will be created. See reference below.'
            source_file.data_path: |-
                - Required - Either the path of an unified image
                or the rootfs tarball of a split image, depending on
                metadata_path being provided or not.
            source_file.metadata_path: '- Optional - Path to the metadata tarball of a split image.'
            source_image: '- Optional - The source image from which the image will be created. See reference below.'
            source_image.architecture: '- Optional - The image architecture (e.g. x86_64, aarch64). See Architectures for all possible values.'
            source_image.copy_aliases: |-
                - Optional - Whether to copy the aliases of the image from
                the remote. Valid values are true and false.
            source_image.name: '- Required - Name of the image.'
            source_image.remote: '- Required - The remote where the image will be pulled from.'
            source_image.type: |-
                - Optional - Type of image to cache. Must be one of container or
                virtual-machine. Defaults to container.
            source_instance: '- Optional - The source instance from which the image will be created. See reference below.'
            source_instance.name: '- Required - Name of the source instance.'
            source_instance.snapshot: '- Optional - Name of the snapshot of the source instance'
        importStatements: []
    incus_instance:
        subCategory: ""
        name: incus_instance
        title: ""
        examples:
            - name: instance1
              manifest: |-
                {
                  "config": {
                    "boot.autostart": true,
                    "limits.cpu": 2
                  },
                  "image": "images:ubuntu/22.04",
                  "name": "instance1"
                }
            - name: instance1
              manifest: |-
                {
                  "device": [
                    {
                      "name": "volume1",
                      "properties": {
                        "path": "/mount/point/in/instance",
                        "pool": "${incus_storage_pool.pool1.name}",
                        "source": "${incus_storage_volume.volume1.name}"
                      },
                      "type": "disk"
                    }
                  ],
                  "image": "ubuntu",
                  "name": "instance1"
                }
              dependencies:
                incus_storage_pool.pool1: |-
                    {
                      "driver": "zfs",
                      "name": "mypool"
                    }
                incus_storage_volume.volume1: |-
                    {
                      "name": "myvolume",
                      "pool": "${incus_storage_pool.pool1.name}"
                    }
            - name: instance2
              manifest: |-
                {
                  "device": [
                    {
                      "name": "http",
                      "properties": {
                        "connect": "tcp:127.0.0.1:80",
                        "listen": "tcp:0.0.0.0:80"
                      },
                      "type": "proxy"
                    }
                  ],
                  "ephemeral": false,
                  "image": "ubuntu",
                  "name": "instance2",
                  "profiles": [
                    "default"
                  ]
                }
            - name: instance1
              manifest: |-
                {
                  "image": "images:debian/12",
                  "name": "instance1",
                  "project": "default"
                }
            - name: instance2
              manifest: |-
                {
                  "name": "instance2",
                  "project": "default",
                  "source_instance": {
                    "name": "instance1",
                    "project": "default"
                  }
                }
            - name: instance1
              manifest: |-
                {
                  "name": "instance1",
                  "project": "default",
                  "source_file": "/path/to/backup.tar.gz"
                }
            - name: instance1
              manifest: |-
                {
                  "device": [
                    {
                      "name": "storage",
                      "properties": {
                        "path": "/",
                        "pool": "pool-name"
                      },
                      "type": "disk"
                    }
                  ],
                  "name": "instance1",
                  "project": "default",
                  "source_file": "/path/to/backup.tar.gz"
                }
            - name: instance1
              manifest: |-
                {
                  "image": "images:debian/12",
                  "name": "instance1",
                  "project": "default",
                  "type": "virtual-machine",
                  "wait_for": [
                    {
                      "type": "agent"
                    }
                  ]
                }
            - name: instance1
              manifest: |-
                {
                  "exec": {
                    "00-install-ssh": {
                      "command": [
                        "apt-get",
                        "update"
                      ],
                      "trigger": "once"
                    },
                    "01-install-ssh": {
                      "command": [
                        "apt-get",
                        "install",
                        "-y",
                        "openssh-server"
                      ],
                      "timeout": "5m",
                      "trigger": "once"
                    },
                    "10-restart-ssh": {
                      "command": [
                        "systemctl",
                        "restart",
                        "ssh"
                      ]
                    }
                  },
                  "file": [
                    {
                      "content": "${var.ssh_pubkey}",
                      "create_directories": true,
                      "gid": 0,
                      "mode": "0600",
                      "target_path": "/root/.ssh/authorized_keys",
                      "uid": 0
                    }
                  ],
                  "image": "images:debian/12",
                  "name": "instance1"
                }
              references:
                file.content: var.ssh_pubkey
            - name: instance1
              manifest: |-
                {
                  "image": "images:ubuntu/24.04/cloud",
                  "name": "instance1",
                  "project": "default",
                  "wait_for": [
                    {
                      "type": "cloud-init"
                    }
                  ]
                }
            - name: instance1
              manifest: |-
                {
                  "image": "images:debian/12",
                  "name": "instance1",
                  "project": "default",
                  "wait_for": [
                    {
                      "delay": "30s",
                      "type": "delay"
                    }
                  ]
                }
            - name: instance1
              manifest: |-
                {
                  "image": "images:debian/12",
                  "name": "instance1",
                  "project": "default",
                  "wait_for": [
                    {
                      "type": "ipv4"
                    }
                  ]
                }
            - name: instance1
              manifest: |-
                {
                  "image": "images:debian/12",
                  "name": "instance1",
                  "project": "default",
                  "wait_for": [
                    {
                      "nic": "eth0",
                      "type": "ipv6"
                    }
                  ]
                }
            - name: instance1
              manifest: |-
                {
                  "image": "images:debian/12",
                  "name": "instance1",
                  "project": "default",
                  "wait_for": [
                    {
                      "nic": "eth0",
                      "type": "ipv4"
                    },
                    {
                      "nic": "eth0",
                      "type": "ipv6"
                    }
                  ]
                }
            - name: instance1
              manifest: |-
                {
                  "config": {
                    "user.access_interface": "eth0"
                  },
                  "image": "images:alpine/edge/amd64",
                  "name": "instance1",
                  "profiles": [
                    "default"
                  ]
                }
            - name: myinst
              manifest: |-
                {
                  "image": "images:alpine/edge/amd64",
                  "name": "c1",
                  "project": "proj"
                }
        argumentDocs:
            <name>: '- Required - Instance name.'
            <project>: '- Optional - Project name.'
            <remote>: '- Optional - Remote name.'
            architecture: '- Optional - The instance architecture (e.g. x86_64, aarch64). See Architectures for all possible values.'
            config: |-
                - Optional - Map of key/value pairs of
                instance config settings.
            description: '- Optional - Description of the instance.'
            device: '- Optional - Device definition. See reference below.'
            device.name: '- Required - Name of the device.'
            device.properties: |-
                - Required - Map of key/value pairs of
                device properties.
            device.type: |-
                - Required - Type of the device Must be one of none, disk, nic,
                unix-char, unix-block, usb, gpu, infiniband, proxy, unix-hotplug, tpm, pci.
            ephemeral: '- Optional - Boolean indicating if this instance is ephemeral. Defaults to false.'
            exec: '- Optional - Map of exec commands to run on the instance. See reference below.'
            exec.command: |-
                - Required - Command to execute as a list of strings where the first
                element is the executable and the rest are arguments.
            exec.environment: '- Optional - Map of environment variables to set for the command.'
            exec.gid: '- Optional - The GID to run the command as.'
            exec.timeout: '- Optional - Timeout for the command, e.g. 30s or 5m.'
            exec.trigger: |-
                - Optional - When to run the command. Supported values are on_change,
                and once. Defaults to on_change.
            exec.uid: '- Optional - The UID to run the command as.'
            exec.working_dir: '- Optional - Working directory for the command.'
            file: '- Optional - File to upload to the instance. See reference below.'
            file.content: |-
                - Required unless source_path is used* - The contents of the file.
                Use the file() function to read in the content of a file from disk.
            file.create_directories: |-
                - Optional - Whether to create the directories leading
                to the target if they do not exist.
            file.gid: '- Optional - The GID of the file. Must be an unquoted integer.'
            file.mode: '- Optional - The octal permissions of the file, must be quoted. Defaults to 0755.'
            file.source_path: |-
                - Required unless content is used* - The source path to a file to
                copy to the instance.
            file.target_path: |-
                - Required - The absolute path of the file on the instance,
                including the filename.
            file.uid: '- Optional - The UID of the file. Must be an unquoted integer.'
            image: |-
                - Optional - Base image from which the instance will be created. Must
                specify an image accessible from the provider remote.
            image=<image>: '- Optional - The image used by the instance.'
            interfaces: '- Map of all instance network interfaces (excluding loopback device). The map key represents the name of the network device (from Incus configuration).'
            ipv4_address: |-
                - The IPv4 Address of the instance. See Instance Network
                Access for more details.
            ipv6_address: |-
                - The IPv6 Address of the instance. See Instance Network
                Access for more details.
            mac_address: |-
                - The MAC address of the detected NIC. See Instance Network
                Access for more details.
            name: '- Required - Name of the instance.'
            profiles: |-
                - Optional - List of Incus config profiles to apply to the new
                instance. Profile default will be applied if profiles are not set (are null).
                However, if an empty array ([]) is set as a value, no profiles will be applied.
            project: '- Optional - Name of the project where the instance will be spawned.'
            remote: |-
                - Optional - The remote in which the resource will be created. If
                not provided, the provider's default remote will be used.
            running: '- Optional - Boolean indicating whether the instance should be started (running). Defaults to true.'
            source_file: '- Optional - The souce backup file from which the instance should be restored. For handling of storage pool, see examples.'
            source_instance: '- Optional - The source instance from which the instance will be created. See reference below.'
            source_instance.name: '- Required - Name of the source instance.'
            source_instance.project: '- Required - Name of the project in which the source instance exists.'
            source_instance.snapshot: '- Optional - Name of the snapshot of the source instance'
            status: '- The status of the instance.'
            target: '- Optional - Specify a target node in a cluster.'
            type: '- Optional - Instance type. Can be container, or virtual-machine. Defaults to container.'
            wait_for: |-
                - Optional - WaitFor definition. See reference below.
                If running is set to false or instance is already running (on update), this value has no effect.
            wait_for.delay: '- Optional - Delay time that should be waited for when type is delay, e.g. 30s.'
            wait_for.nic: '- Optional - Network interface that should be waited for when type is ipv4 or ipv6.'
            wait_for.type: '- Required - Type for what should be waited for. Can be agent, cloud-init, delay, ipv4, ipv6 or ready.'
        importStatements:
            - terraform import incus_instance.myinst proj/c1,image=images:alpine/edge/amd64
    incus_instance_snapshot:
        subCategory: ""
        name: incus_instance_snapshot
        title: ""
        examples:
            - name: snap1
              manifest: |-
                {
                  "instance": "${incus_instance.instance.name}",
                  "name": "my-snapshot-1"
                }
              references:
                instance: incus_instance.instance.name
              dependencies:
                incus_instance.instance: |-
                    {
                      "ephemeral": false,
                      "image": "ubuntu",
                      "name": "my-instance"
                    }
        argumentDocs:
            created_at: |-
                - The time Incus  reported the snapshot was successfully created,
                in UTC.
            instance: '- Required - The name of the instance to snapshot.'
            name: '- Required - Name of the snapshot.'
            project: '- Optional - Name of the project where the snapshot will be stored.'
            remote: |-
                - Optional - The remote in which the resource will be created. If
                not provided, the provider's default remote will be used.
            stateful: |-
                - Optional - Set to true to create a stateful snapshot,
                false for stateless. Stateful snapshots include runtime state. Defaults to
                false.
        importStatements: []
    incus_network:
        subCategory: ""
        name: incus_network
        title: ""
        examples:
            - name: new_default
              manifest: |-
                {
                  "config": {
                    "ipv4.address": "10.150.19.1/24",
                    "ipv4.nat": "true",
                    "ipv6.address": "fd42:474b:622d:259d::1/64",
                    "ipv6.nat": "true"
                  },
                  "name": "new_default"
                }
              dependencies:
                incus_instance.test1: |-
                    {
                      "ephemeral": false,
                      "image": "ubuntu",
                      "name": "test1",
                      "profiles": [
                        "${incus_profile.profile1.name}"
                      ]
                    }
                incus_profile.profile1: |-
                    {
                      "device": [
                        {
                          "name": "eth0",
                          "properties": {
                            "nictype": "bridged",
                            "parent": "${incus_network.new_default.name}"
                          },
                          "type": "nic"
                        },
                        {
                          "name": "root",
                          "properties": {
                            "path": "/",
                            "pool": "default"
                          },
                          "type": "disk"
                        }
                      ],
                      "name": "profile1"
                    }
            - name: internal
              manifest: |-
                {
                  "config": {
                    "ipv4.address": "192.168.255.1/24"
                  },
                  "name": "internal"
                }
              dependencies:
                incus_instance.test1: |-
                    {
                      "ephemeral": false,
                      "image": "ubuntu",
                      "name": "test1",
                      "profiles": [
                        "default",
                        "${incus_profile.profile1.name}"
                      ],
                      "provisioner": {
                        "local-exec": [
                          {
                            "command": "lxc exec local:${self.name} dhclient eth1"
                          }
                        ]
                      }
                    }
                incus_profile.profile1: |-
                    {
                      "device": [
                        {
                          "name": "eth1",
                          "properties": {
                            "nictype": "bridged",
                            "parent": "${incus_network.internal.name}"
                          },
                          "type": "nic"
                        },
                        {
                          "name": "root",
                          "properties": {
                            "path": "/",
                            "pool": "default"
                          },
                          "type": "disk"
                        }
                      ],
                      "name": "profile1"
                    }
            - name: vxtun
              manifest: |-
                {
                  "config": {
                    "ipv4.address": "192.168.255.1/24",
                    "ipv6.address": "none",
                    "tunnel.vxtun.id": 9999,
                    "tunnel.vxtun.local": "10.1.1.1",
                    "tunnel.vxtun.protocol": "vxlan",
                    "tunnel.vxtun.remote": "10.255.1.1"
                  },
                  "name": "vxtun"
                }
            - name: vxtun
              manifest: |-
                {
                  "config": {
                    "ipv4.address": "none",
                    "ipv6.address": "none",
                    "tunnel.vxtun.id": 9999,
                    "tunnel.vxtun.local": "10.255.1.1",
                    "tunnel.vxtun.protocol": "vxlan",
                    "tunnel.vxtun.remote": "10.1.1.1"
                  },
                  "name": "vxtun"
                }
            - name: my_network_node1
              manifest: |-
                {
                  "name": "my_network",
                  "target": "node1"
                }
            - name: my_network_node2
              manifest: |-
                {
                  "name": "my_network",
                  "target": "node2"
                }
            - name: my_network
              manifest: |-
                {
                  "config": {
                    "ipv4.address": "10.150.19.1/24",
                    "ipv4.nat": "true",
                    "ipv6.address": "fd42:474b:622d:259d::1/64",
                    "ipv6.nat": "true"
                  },
                  "depends_on": [
                    "incus_network.my_network_node1",
                    "incus_network.my_network_node2"
                  ],
                  "name": "my_network"
                }
            - name: mynet
              manifest: |-
                {
                  "name": "net1",
                  "project": "proj"
                }
            - name: my_network_node1
              manifest: |-
                {
                  "name": "net1",
                  "project": "proj",
                  "target": "node1"
                }
            - name: my_network_node2
              manifest: |-
                {
                  "name": "net1",
                  "project": "proj",
                  "target": "node2"
                }
            - name: my_network
              manifest: |-
                {
                  "name": "net1",
                  "project": "proj"
                }
        argumentDocs:
            <name>: '- Required - Network name.'
            <project>: '- Optional - Project name.'
            <remote>: '- Optional - Remote name.'
            config: |-
                - Optional - Map of key/value pairs of
                network config settings. The config should be identical for all resources referencing the same clustered network, only members keys may differ.
            description: '- Optional - Description of the network. description is mutual exclusive with target. The description can only be set on cluster level (with target not set) or on non-clustered setups.'
            managed: '- Whether or not the network is managed.'
            name: |-
                - Required - Name of the network. This is usually the device the
                network will appear as to instances.
            project: '- Optional - Name of the project where the network will be created.'
            remote: |-
                - Optional - The remote in which the resource will be created. If
                not provided, the provider's default remote will be used.
            target: '- Optional - Specify a target node in a cluster.'
            target=<member>: '- Optional - Cluster node name.'
            type: |-
                - Optional - The type of network to create. Can be one of: bridge,
                macvlan, sriov, ovn, or physical. If no type is specified, a bridge network
                is created.
        importStatements:
            - terraform import incus_network.mynet proj/net1
            - |-
              terraform import incus_network.my_network_node1 proj/net1,target=node1
              terraform import incus_network.my_network_node2 proj/net1,target=node2
              terraform import incus_network.my_network proj/net1
    incus_network_acl:
        subCategory: ""
        name: incus_network_acl
        title: ""
        examples:
            - name: acl1
              manifest: |-
                {
                  "egress": [
                    {
                      "action": "allow",
                      "description": "DNS to cloudflare public resolvers (UDP)",
                      "destination": "1.1.1.1,1.0.0.1",
                      "destination_port": "53",
                      "protocol": "udp",
                      "state": "enabled"
                    },
                    {
                      "action": "allow",
                      "description": "DNS to cloudflare public resolvers (TCP)",
                      "destination": "1.1.1.1,1.0.0.1",
                      "destination_port": "53",
                      "protocol": "tcp",
                      "state": "enabled"
                    }
                  ],
                  "ingress": [
                    {
                      "action": "allow",
                      "description": "Incoming SSH connections",
                      "destination_port": "22",
                      "protocol": "tcp",
                      "source": "@external",
                      "state": "logged"
                    },
                    {
                      "action": "allow",
                      "description": "DHCP to instance",
                      "destination_port": "68",
                      "protocol": "udp",
                      "source": "@external",
                      "source_port": "67",
                      "state": "enabled"
                    }
                  ],
                  "name": "my-acl"
                }
            - name: acl1
              manifest: |-
                {
                  "name": "acl1",
                  "project": "proj"
                }
        argumentDocs:
            <name>: '- Required - Network name.'
            <project>: '- Optional - Project name.'
            <remote>: '- Optional - Remote name.'
            action: '- Required - Action to take for matching traffic, must be one of allow, allow-stateless, drop, reject'
            config: |-
                - Optional - Map of key/value pairs of
                network ACL config settings.
            description: '- Optional - Description of the network ACL.'
            destination: '- Optional - Comma-separated list of CIDR or IP ranges, destination subject name selectors (for egress rules), or empty for any'
            destination_port: '- Optional - If protocol is udp or tcp, then a comma-separated list of ports or port ranges (start-end inclusive), or empty for any'
            egress: '- Optional - List of network ACL rules for egress traffic. See reference below.'
            icmp_code: '- Optional - If protocol is icmp4 or icmp6, then ICMP code number, or empty for any'
            icmp_type: '- Optional - If protocol is icmp4 or icmp6, then ICMP type number, or empty for any'
            ingress: '- Optional - List of network ACL rules for ingress traffic. See reference below.'
