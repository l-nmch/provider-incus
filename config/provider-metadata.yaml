                  "name": "restored-volume",
                  "pool": "default",
                  "source_file": "/path/to/volume.backup"
                }
            - name: volume1
              manifest: |-
                {
                  "file": [
                    {
                      "create_directories": true,
                      "gid": 1000,
                      "mode": "0644",
                      "source_path": "config.conf",
                      "target_path": "/etc/app/config.conf",
                      "uid": 1000
                    }
                  ],
                  "name": "my-config-vol",
                  "pool": "${incus_storage_pool.pool1.name}",
                  "project": "default"
                }
              references:
                pool: incus_storage_pool.pool1.name
              dependencies:
                incus_storage_pool.pool1: |-
                    {
                      "driver": "zfs",
                      "name": "mypool"
                    }
            - name: myvol
              manifest: |-
                {
                  "name": "vol1",
                  "pool": "pool1",
                  "project": "proj"
                }
        argumentDocs:
            <name>: '- Required - Volume name.'
            <pool>: '- Required - Storage pool name.'
            <project>: '- Optional - Project name.'
            <remote>: '- Optional - Remote name.'
            config: |-
                - Optional - Map of key/value pairs of
                volume config settings.
                Config settings vary depending on the Storage Pool used.
            content_type: '- Optional - Volume content type (filesystem or block)'
            description: '- Optional - Description of the volume.'
            disk: .
            file: '- Optional - File to upload to the storage volume. See reference below.'
            file.content: |-
                - Optional - The contents of the file. Mutually exclusive with source_path.
                Use the file() function to read in the content of a file from disk.
            file.create_directories: |-
                - Optional - Whether to create the directories leading
                to the target if they do not exist.
            file.gid: '- Optional - The GID of the file. Must be an unquoted integer.'
            file.mode: '- Optional - The octal permissions of the file, must be quoted. Defaults to 0755.'
            file.source_path: |-
                - Optional - The source path to a file to
                copy to the volume. Mutually exclusive with content.
            file.target_path: |-
                - Required - The absolute path of the file on the volume,
                including the filename.
            file.uid: '- Optional - The UID of the file. Must be an unquoted integer.'
            location: '- Name of the node where volume was created. It could be useful with Incus in cluster mode.'
            name: '- Required - Name of the storage volume.'
            pool: '- Required - Name of storage pool to host the volume.'
            project: '- Optional - Name of the project where the volume will be stored.'
            remote: |-
                - Optional - The remote in which the resource will be created. If
                not provided, the provider's default remote will be used.
            source_file: '- Optional - Path to a backup file from which the volume will be created.'
            source_volume: '- Optional - The source volume from which the volume will be created. See reference below.'
            source_volume.name: '- Required - Name of the storage volume.'
            source_volume.pool: '- Required - The storage pool that will receive the copy of the volume copy.'
            source_volume.remote: |-
                - Optional - The remote in which the resource will be created. If
                not provided, the provider's default remote will be used.
            target: '- Optional - Specify a target node in a cluster.'
            type: |-
                - Optional - The "type" of volume. The default value is custom,
                which is the type to use for storage volumes attached to instances.
        importStatements:
            - terraform import incus_storage_volume.myvol proj/pool1/vol1
    network_load_balancer:
        subCategory: ""
        name: network_load_balancer
        title: ""
        argumentDocs:
            backend: '- Optional - Load balancer''s backend definition. See reference below.'
            backend.description: '- Optional - Description of the load balancer''s backend.'
            backend.name: '- Required - Name of the load balancer''s backend.'
            backend.target_address: '- Required - IP address to forward to.'
            backend.target_port: '- Optional - Target port(s) (e.g. 80, 80,32000-32080). Default: listen_port of the corresponding port block'
            config: '- Optional - Map of key/value pairs network load balancer config settings'
            description: '- Optional - Description of the network load balancer.'
            listen_address: '- Required - IP address to listen on. Also, see the Requirements for listen address in the official Incus documentation.'
            network: '- Required - Name of the uplink network.'
            port: '- Optional - Load balancer''s port definition. See reference below.'
            port.description: '- Optional - Description of the load balancer''s port.'
            port.listen_port: '- Required - Listen port(s) (e.g. 80, 80,32000-32080).'
            port.protocol: '- Optional - Protocol of the port(s). Can be either tcp or udp. Default: tcp'
